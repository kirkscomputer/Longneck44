<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Longneck44 Photos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.16/tailwind.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f5f5f0;
            color: #333;
        }
        header {
            background-color: #fff;
            border-bottom: 1px solid #ddd;
            padding-top: 2rem;
            padding-bottom: 2rem;
        }
        .image-container img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            transition: transform 0.2s; /* Smooth hover effect */
        }
        .image-container:hover {
            transform: scale(1.05); /* Slight zoom on hover */
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1); /* Subtle shadow on hover */

        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.9);
        }
        .modal-content {
            margin: auto;
            display: block;
            max-width: 75%;
            max-height: 75%;
        }
        .close {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            transition: 0.3s;
        }
        .close:hover,
        .close:focus {
            color: #bbb;
            text-decoration: none;
            cursor: pointer;
        }
        footer {
            background-color: #fff;
            border-top: 1px solid #ddd;
            padding-top: 1rem;
            padding-bottom: 1rem;
        }
    </style>
    <script>
        function updateLastUpdated() { /* ... (timestamp function) ... */ }
        window.onload = updateLastUpdated;
        function openModal(imageUrl) { /* ... (modal function) ... */ }
        function closeModal() { /* ... (close modal function) ... */ }
    </script>
</head>
<body class="bg-gray-900 text-white">
    <header>
        <div class="container mx-auto flex items-center justify-between">
            <h1 class="text-2xl font-bold text-black">Longneck44 Photos</h1>
            <nav>
                <ul class="flex space-x-4">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="#">Photos</a></li>
                    <li><a href="#" target="_blank">Rental</a></li>
                    <li><a href="index.html#contact">Contact Us</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container mx-auto py-8">
        <section class="mb-8">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="image-grid"></div>
        </section>
    </main>

    <footer>
        <p class="text-center">&copy; 2023 Longneck44. All rights reserved. Last updated: <span id="last-updated"></span></p>
    </footer>

    <script>
        const imageList = [ /* ... (your image list) ... */ ];
        const imageGrid = document.getElementById('image-grid');

        imageList.forEach(imageName => {
            const imageUrl = `https://raw.githubusercontent.com/kirkscomputer/Longneck44/main/images/${imageName}`;
            const imageContainer = document.createElement('div');
            imageContainer.className = 'image-container rounded-lg overflow-hidden cursor-pointer';
            imageContainer.innerHTML = `<img src="${imageUrl}" alt="${imageName.replace('.jpg', '')}" onclick="openModal('${imageUrl}')">`;
            imageGrid.appendChild(imageContainer);
        });

        function openModal(imageUrl) { /* ... (modal function) ... */ }
        function closeModal() { /* ... (close modal function) ... */ }
        function updateLastUpdated() { /* ... (timestamp function) ... */ }

        updateLastUpdated();
    </script>
</body>
</html>
