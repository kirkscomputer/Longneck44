<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Longneck44 Photos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.16/tailwind.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f8f5f0;
            color: #333333;
        }
        header {
            background-color: transparent;
            padding-top: 2rem;
            padding-bottom: 2rem;
        }
        .image-container img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            transition: transform 0.3s;
        }
        .image-container:hover {
            transform: scale(1.03);
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.15);
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.9);
        }
        .modal-content {
            margin: auto;
            display: block;
            max-width: 90%;
            max-height: 90%;
        }
        .close {
            position: absolute;
            top: 20px;
            right: 40px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            transition: 0.3s;
        }
        .close:hover,
        .close:focus {
            color: #d8b68c;
            text-decoration: none;
            cursor: pointer;
        }
        footer {
            color: #333333;
            padding-top: 2rem; 
            padding-bottom: 2rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="container mx-auto flex items-center justify-between">
            <h1 class="text-2xl tracking-wide">Longneck44 Photos</h1>
            <nav>
                <ul class="flex space-x-6 items-center tracking-wider">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="#">Photos</a></li>
                    <li><a href="#" target="_blank">Rental</a></li>
                    <li>
                        <a href="index.html#contact" id="contact-btn" class="bg-transparent hover:bg-gray-900 text-gray-900 font-medium hover:text-white px-6 py-1.5 border border-gray-900 hover:border-transparent uppercase tracking-wide">
                            Contact Us
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>
    <main class="container mx-auto py-12">
        <section class="mb-12">  
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="image-grid"></div>
        </section>
    </main>
    
    <footer>
        <p class="text-center">&copy; <span id="year"></span> Longneck44. All rights reserved.</p>
    </footer>
    
    <div id="modal" class="modal">
        <span class="close cursor" onclick="closeModal()">&times;</span>
        <img class="modal-content" id="modal-image">
    </div>
    
    <script>
        const imageList = [ /* ... (your image list) ... */ ];
        const imageGrid = document.getElementById('image-grid');
    
        imageList.forEach(imageName => {
            const imageUrl = `https://raw.githubusercontent.com/kirkscomputer/Longneck44/main/images/${imageName}`;
            const imageContainer = document.createElement('div');
            imageContainer.className = 'image-container rounded-lg overflow-hidden cursor-pointer';
            imageContainer.innerHTML = `<img src="${imageUrl}" alt="${imageName.replace('.jpg', '')}" onclick="openModal('${imageUrl}')">`;
            imageGrid.appendChild(imageContainer);
        });
    
        function openModal(imageUrl) {
            const modal = document.getElementById('modal');
            const modalImage = document.getElementById('modal-image');
            modalImage.src = imageUrl;
            modal.style.display = 'block';
        }
    
        function closeModal() {
            const modal = document.getElementById('modal');
            modal.style.display = 'none';
        }
    </script>
    </body>
    </html>
