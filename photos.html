<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Longneck44 Photos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.16/tailwind.min.css">
    <style>
        /* Basic styling for the pop-up */
        .modal {
            display: none; /* Hidden by default */
            position: fixed; /* Stay in place */
            z-index: 1; /* Sit on top */
            left: 0;
            top: 0;
            width: 100%; /* Full width */
            height: 100%; /* Full height */
            overflow: auto; /* Enable scroll if needed */
            background-color: rgb(0,0,0); /* Fallback color */
            background-color: rgba(0,0,0,0.9); /* Black w/ opacity */
        }

        .modal-content {
            margin: auto;
            display: block;
            max-width: 90%;
            max-height: 90%;
        }

        .close {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            transition: 0.3s;
        }

        .close:hover,
        .close:focus {
            color: #bbb;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-gray-900 text-white">
    <header class="py-6 bg-gray-800">
        <div class="container mx-auto flex items-center justify-between">
            <h1 class="text-2xl font-bold">Longneck44 Photos</h1>
            <nav>
                <ul class="flex space-x-4">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="#">Photos</a></li>
                    <li><a href="#" target="_blank">Rental</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container mx-auto py-8">
        <section class="mb-8">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                </div>
        </section>
    </main>

    <footer class="bg-gray-800 py-4 text-center">
        <p>&copy; 2023 Longneck44. All rights reserved. Update 10/13/2024</p>
    </footer>

    <script>
        const imageList = [
            "Bedroom2.jpg", "Bedroom2_FullBed.jpg", "DiningArea.jpg", "Entry.jpg", "Garage.jpg",
            "Kitchen.jpg", "Laundry.jpg", "Living_Room.jpg", "Master_TV_55.jpg", "OutsideView2.jpg",
            "OutsideViews1.jpg", "Outside_View.jpg", "Patio.jpg", "Shared_Bath.jpg", "View_from_entryway.jpg",
            "master_bath.jpg", "master_bedroom.jpg", "master_closet.jpg", "master_shower.jpg"
        ];
        const imageContainer = document.querySelector('.grid');

        imageList.forEach(imageName => {
            const imageUrl = `https://raw.githubusercontent.com/kirkscomputer/Longneck44/main/images/${imageName}`;
            const imageDiv = document.createElement('div');
            imageDiv.className = 'rounded-lg overflow-hidden cursor-pointer'; // Added cursor-pointer
            imageDiv.innerHTML = `<img src="${imageUrl}" alt="${imageName.replace('.jpg', '')}" class="w-full h-full object-cover" onclick="openModal('${imageUrl}')">`;
            imageContainer.appendChild(imageDiv);
        });

        function openModal(imageUrl) {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `
                <span class="close" onclick="closeModal()">&times;</span>
                <img class="modal-content" src="${imageUrl}">
            `;
            document.body.appendChild(modal);
            modal.style.display = "block";
        }

        function closeModal() {
            const modal = document.querySelector('.modal');
            modal.remove();
        }
    </script>
</body>
</html>
